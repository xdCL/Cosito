name: Firefox update prompt diagnostics
on:
  push:
    branches:
      - feat/modal-update-prompt
permissions:
  contents: read
jobs:
  firefox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps firefox
      - run: npx playwright test --project=firefox e2e/privacy-theme.spec.ts --reporter=line
